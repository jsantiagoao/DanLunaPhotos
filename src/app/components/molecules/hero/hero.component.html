<section class="hero">
  <!--
    Antes era un background-image de CSS: el navegador no puede priorizarlo ni
    servir WebP, y bloqueaba el LCP. Como <picture> se descarga con prioridad
    alta y cada navegador elige el formato que soporta.
  -->
  <picture class="hero__media">
    <!-- Cada pantalla descarga su tamaño: en móvil 77 KB en lugar de 298 KB. -->
    <source type="image/webp" sizes="100vw"
            srcset="assets/images/bg/hero-bg-800.webp 800w, assets/images/bg/hero-bg-1200.webp 1200w, assets/images/bg/hero-bg-1600.webp 1600w, assets/images/bg/hero-bg.webp 1920w">
    <img src="assets/images/bg/hero-bg.jpg" alt="" aria-hidden="true"
         fetchpriority="high" decoding="async" width="1920" height="1280">
  </picture>

  <div class="hero__overlay"></div>

  <div class="hero__inner">
    <!-- La etiqueta va dentro del H1: el título lleva servicio y ciudad (SEO local)
         sin cambiar el diseño. -->
    <h1 class="hero__headline">
      <span class="hero__badge"><span>Fotógrafa profesional en Querétaro</span></span>
      <span class="hero__headline-main">Cada momento,<br>un recuerdo.</span>
    </h1>

    <p class="hero__sub">
      Fotografía de retratos, bodas y sesiones artísticas.<br>
      Capturando la esencia de cada persona y momento.
    </p>

    <div class="hero__ctas">
      <button class="hero__cta hero__cta--primary" (click)="scrollToContact()">
        Reservar sesión
      </button>
    </div>
  </div>
</section>
