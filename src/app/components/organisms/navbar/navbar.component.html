<nav class="navbar">
  <div class="navbar__inner">

    <a class="navbar__logo" href="#inicio" (click)="scrollTo('#inicio'); $event.preventDefault()">
      <img src="assets/images/logo-light.png" alt="Dan Luna Photo" width="422" height="150" />
    </a>

    <ul id="navbar-menu" class="navbar__links" [class.navbar__links--open]="menuOpen()">
      @for (link of links; track link.label) {
        <li
          class="navbar__item"
          [class.navbar__item--has-submenu]="link.submenu"
          [class.navbar__item--open]="link.submenu && activeSubmenu() === link.label"
        >
          @if (link.submenu) {
            <button
              class="navbar__link"
              (click)="toggleSubmenu(link.label)"
              [attr.aria-expanded]="activeSubmenu() === link.label"
            >
              {{ link.label }}
              <span class="navbar__arrow">▼</span>
            </button>
            <ul class="navbar__submenu" [class.navbar__submenu--visible]="activeSubmenu() === link.label">
              <div class="navbar__submenu-content">
                @for (subitem of link.submenu; track subitem.label) {
                  <li>
                    @if (subitem.external) {
                      <a [href]="subitem.href" target="_blank" rel="noopener" (click)="closeMenu()">
                        {{ subitem.label }}
                      </a>
                    } @else {
                      <a [href]="subitem.href" (click)="scrollTo(subitem.href); $event.preventDefault()">
                        {{ subitem.label }}
                      </a>
                    }
                  </li>
                }
              </div>
            </ul>
          } @else {
            <a class="navbar__link" [href]="link.href" (click)="scrollTo(link.href!); $event.preventDefault()">
              {{ link.label }}
            </a>
          }
        </li>
      }
      <!-- En móvil el CTA del header se oculta: se repite dentro del menú. -->
      <li class="navbar__item navbar__item--cta">
        <a class="navbar__mobile-cta" [href]="bookingUrl" target="_blank" rel="noopener" (click)="closeMenu()">
          Reservar sesión
        </a>
      </li>
    </ul>

    <div class="navbar__right">
      <a class="navbar__cta" [href]="bookingUrl" target="_blank" rel="noopener">
        Reservar sesión
      </a>
    </div>

    <button class="navbar__hamburger" [class.navbar__hamburger--open]="menuOpen()" (click)="toggleMenu()"
            aria-label="Menú" aria-controls="navbar-menu" [attr.aria-expanded]="menuOpen()">
      <span></span><span></span><span></span>
    </button>

  </div>
</nav>
